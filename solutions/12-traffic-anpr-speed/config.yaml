# Solution 12 — Traffic cameras: plate reading (ANPR), section speed enforcement, traffic analytics.
# Secrets (camera URLs, HMAC key) come from environment variables / .env.

site:
  authority: ${AUTHORITY_NAME:-Traffic Directorate (example)}
  timezone: Asia/Baghdad

cameras:
  - id: hwy1-km12-n                      # entry point of a section, northbound
    name: Highway 1 km 12 northbound
    url: ${CAM_HWY1_KM12_N_URL:-rtsp://user:pass@10.20.1.12:554/stream1}
    fps: 10                              # plate reading needs more frames than intrusion detection
    lanes:                               # trigger line per lane, pixel coordinates [[x1,y1],[x2,y2]]
      - {id: 1, line: [[100, 600], [620, 600]]}
      - {id: 2, line: [[640, 600], [1180, 600]]}
    ground_points:                       # optional spot-speed calibration: 4 image points -> metres on the road
      image: [[300, 400], [980, 400], [1180, 700], [100, 700]]
      world: [[0, 40], [7.2, 40], [7.2, 0], [0, 0]]
  - id: hwy1-km17-n                      # exit point, 5.0 km later
    name: Highway 1 km 17 northbound
    url: ${CAM_HWY1_KM17_N_URL:-rtsp://user:pass@10.20.1.17:554/stream1}
    fps: 10
    lanes:
      - {id: 1, line: [[100, 600], [620, 600]]}
      - {id: 2, line: [[640, 600], [1180, 600]]}

sections:                                # average-speed (section control) pairs: the evidential method
  - id: hwy1-n-km12-17
    entry: hwy1-km12-n
    exit: hwy1-km17-n
    distance_m: 5000.0                   # surveyed road distance between the two trigger lines
    limit_kmh: 110
    tolerance_kmh: 10                    # enforcement margin agreed with the authority
    max_travel_s: 1800                   # forget entry reads older than this

detector:
  model: models/detector/model.onnx      # fine-tuned RT-DETRv2 with classes below (IMPLEMENTATION Step 5)
  vehicle_classes: [car, truck, bus, motorcycle]
  plate_class: license_plate
  threads: 0
  min_score: 0.35

ocr:
  model: models/ocr/plate_ocr.onnx       # CRNN-CTC trained on YOUR plate crops (Step 6)
  min_confidence: 0.80                   # below this the read is kept for statistics but never used for a violation
  crops_per_vehicle: 3                   # best crops voted per vehicle
  formats:                               # regular expressions of valid plate texts (after normalisation).
    - '^[0-9]{1,6}[A-Z]{0,2}$'           # EXAMPLES ONLY: replace with the official formats of the Iraqi
    - '^[A-Z]{1,2}[0-9]{1,6}$'           # traffic directorate / KRG before go-live (Step 6)

timing:
  max_clock_offset_s: 0.050              # violations are blocked when chrony reports a larger offset
  clock_check_interval_s: 60

retention:
  reads_hours: 24                        # plate reads that are not part of a violation are deleted after this
  violations_days: 365                   # or as the law requires
  hmac_key: ${PLATE_HMAC_KEY:-change-me} # keyed hash of plates for anonymous traffic statistics

storage:
  db: data/traffic.db
  media_dir: data/media
  evidence_key: data/keys/evidence_ed25519.pem

security:
  tokens_file: tokens.yaml

server:
  host: 127.0.0.1
  port: 8012
