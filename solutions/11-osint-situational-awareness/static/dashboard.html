<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Situational Awareness</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e3e6ea; --s5:#b71c1c; --s4:#e65100; --s3:#f9a825; --s2:#558b2f; --s1:#78909c; }
  body { margin:0; font-family:system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; background:#20303f; color:#fff; position:sticky; top:0; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:200px; }
  input, select, button { font:inherit; padding:6px 10px; border-radius:6px; border:1px solid #c7ccd3; }
  main { display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .ev { background:var(--card); border:1px solid var(--line); border-inline-start:5px solid var(--s1); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .ev.s5 { border-inline-start-color:var(--s5); } .ev.s4 { border-inline-start-color:var(--s4); } .ev.s3 { border-inline-start-color:var(--s3); } .ev.s2 { border-inline-start-color:var(--s2); }
  .meta { font-size:12px; color:var(--muted); }
  .en { direction:ltr; text-align:left; color:#374151; font-size:14px; }
  aside section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  aside h2 { font-size:15px; margin:0 0 8px; }
  pre { white-space:pre-wrap; font-family:inherit; font-size:13px; direction:auto; }
  .gov { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  a { color:#1565c0; }
</style>
</head>
<body>
<header>
  <h1>الوعي الظرفي / Situational awareness</h1>
  <select id="hours"><option value="24">24 h</option><option value="72">72 h</option><option value="168">7 d</option></select>
  <select id="cat"><option value="">كل الفئات / All categories</option></select>
  <select id="sev"><option value="1">S1+</option><option value="3" selected>S3+</option><option value="4">S4+</option></select>
  <input id="q" placeholder="بحث / search" size="14"><button onclick="search()">🔍</button>
  <input id="token" type="password" placeholder="API token" size="14"><button onclick="login()">دخول / Login</button>
</header>
<main>
  <div id="events"></div>
  <aside>
    <section><h2>حسب المحافظة / By governorate</h2><div id="govs"></div></section>
    <section><h2>المصادر / Sources</h2><div id="sources" class="meta"></div></section>
    <section><h2>الموجز / Briefing</h2><pre id="brief"></pre></section>
  </aside>
</main>
<script>
const CATS = ["security_incident","protest_civil_unrest","infrastructure_outage","weather_environment","health",
  "economy_markets","government_policy","transport","cyber","humanitarian","other"];
CATS.forEach(c => document.getElementById("cat").insertAdjacentHTML("beforeend", `<option value="${c}">${c.replaceAll("_"," ")}</option>`));
let token = sessionStorage.getItem("token") || "";
const H = () => ({ Authorization: "Bearer " + token });
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function login() { token = document.getElementById("token").value.trim(); sessionStorage.setItem("token", token); load(); }
function render(evs) {
  document.getElementById("events").innerHTML = evs.map(e => `<div class="ev s${e.severity}">
    <div class="meta">S${e.severity} · ${e.category.replaceAll("_"," ")} · ${e.governorates.join(", ") || "-"} ·
      ${new Date(e.published * 1000).toLocaleString("en-GB")} · ${esc(e.source)}</div>
    <div>${esc(e.summary_ar)}</div><div class="en">${esc(e.summary_en)}</div>
    <div class="meta"><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a></div></div>`).join("")
    || "<p class='meta'>لا توجد أحداث / No events</p>";
  const counts = {};
  evs.forEach(e => e.governorates.forEach(g => counts[g] = (counts[g] || 0) + 1));
  document.getElementById("govs").innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1])
    .map(([g, n]) => `<div class="gov"><span>${g}</span><b>${n}</b></div>`).join("");
}
async function load() {
  if (!token) return;
  const p = new URLSearchParams({ hours: hours.value, min_severity: sev.value });
  if (cat.value) p.set("category", cat.value);
  const r = await fetch("/api/events?" + p, { headers: H() });
  if (!r.ok) { document.getElementById("events").textContent = "HTTP " + r.status; return; }
  render(await r.json());
  const s = await (await fetch("/api/sources", { headers: H() })).json();
  document.getElementById("sources").innerHTML = s.map(x => `${x.last_error ? "⚠" : "✔"} ${x.id} (${x.items_total})`).join("<br>");
  document.getElementById("brief").textContent = await (await fetch("/api/briefings/latest", { headers: H() })).text();
}
async function search() {
  const r = await fetch("/api/search?q=" + encodeURIComponent(q.value), { headers: H() });
  if (r.ok) render(await r.json());
}
["hours", "cat", "sev"].forEach(id => document.getElementById(id).onchange = load);
setInterval(load, 60000);
load();
</script>
</body>
</html>
